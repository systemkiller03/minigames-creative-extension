name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: minigames
          POSTGRES_PASSWORD: minigames
          POSTGRES_DB: minigames
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U minigames" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      HUSKY: '0'
      NODE_ENV: development
      DATABASE_URL: postgres://minigames:minigames@127.0.0.1:5432/minigames
      REDIS_URL: redis://127.0.0.1:6379
      # Tests replace the upstream with an in-memory fake; nothing calls this host.
      UPSTREAM_BASE_URL: http://upstream.invalid
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-0001
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-02
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter api typecheck
      - run: pnpm --filter api build
      - run: pnpm --filter api exec node-pg-migrate up -m migrations
      - run: pnpm --filter api test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t minigames-api:ci .
